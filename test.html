<h1>🧪 测试 - 今天吃什么</h1>
<div id="summary" class="summary">运行中...</div>
<div id="results"></div>

<script>
// ============ 复制自 app.html 的算法和数据 ============
const DISHES_DATA = [
  {name: "西红柿炒蛋", time_minutes: 15, role: "主菜", ingredients: ["鸡蛋", "西红柿"], seasonings: ["盐", "糖", "油"], steps: ["鸡蛋打散", "炒蛋盛出", "炒西红柿", "合炒"], tip: "加点糖"},
  {name: "米饭", time_minutes: 20, role: "主食", ingredients: ["大米"], seasonings: ["水"], steps: ["淘米", "加水", "煮"], tip: ""},
  {name: "紫菜蛋花汤", time_minutes: 10, role: "汤", ingredients: ["紫菜", "鸡蛋"], seasonings: ["盐"], steps: ["烧水", "下紫菜", "淋蛋", "加盐"], tip: ""},
  {name: "凉拌黄瓜", time_minutes: 5, role: "凉菜", ingredients: ["黄瓜", "蒜"], seasonings: ["醋", "盐"], steps: ["拍黄瓜", "调汁", "拌匀"], tip: ""},
  {name: "假数据", time_minutes: 30, role: "主菜", ingredients: ["无"], seasonings: ["无"], steps: [], tip: ""}
];

class Dish {
  constructor(d) {
    this.name = d.name; this.time_minutes = d.time_minutes; this.role = d.role;
    this.tags = d.tags || [];
    this.ingredients = d.ingredients || [];
    this.seasonings = d.seasonings || [];
    this.steps = d.steps || [];
    this.tip = d.tip || "";
    this.nutrition = d.nutrition || [];
  }
}

function chooseOne(dishes) {
  return dishes[Math.floor(Math.random() * dishes.length)];
}
function filterByMaxTime(dishes, max) {
  return dishes.filter(d => d.time_minutes <= max);
}
function filterByIngredients(dishes, available) {
  if (!available || available.length === 0) return [];
  // 测试副本：保持与 app.html 同款（同义词扩展 + 多字段搜索）
  const INGREDIENT_SYNONYMS = {
    '肉': ['肉', '猪肉', '牛肉', '羊肉', '鸡肉', '鸭肉', '鹅肉', '五花肉', '里脊肉', '肉末', '肉丝', '肉片', '肉块', '排骨', '牛里脊', '牛腱子', '牛腩', '牛排', '羊肉片', '鸡腿', '鸡翅', '鸡胸', '鸡块', '鸡丁', '鸭腿', '鸭翅'],
    '牛': ['牛', '牛肉', '牛里脊', '牛腱子', '牛腩', '牛排'],
    '羊': ['羊', '羊肉', '羊肉片'],
    '鸡': ['鸡', '鸡肉', '鸡腿', '鸡翅', '鸡胸', '鸡块', '鸡丁'],
    '鸭': ['鸭', '鸭肉', '鸭腿', '鸭翅'],
    '菜': ['菜', '蔬', '白菜', '萝卜', '芹', '茄', '黄瓜', '菠', '韭菜', '青菜'],
    '蛋': ['蛋', '鸡蛋', '蛋花'],
    '豆': ['豆', '豆腐', '豆浆'],
    '海鲜': ['虾', '蟹', '鱼', '鱿', '蛤', '海带', '紫菜'],
    '辣': ['辣', '椒', '麻辣', '红油'],
    // 地域别名：每个变体都作为 key，展开为所有别名
    '包菜': ['包菜', '卷心菜', '圆白菜', '茴子白', '兰包', '椰菜'],
    '西红柿': ['西红柿', '番茄'],
    '土豆': ['土豆', '马铃薯', '洋芋'],
    '玉米': ['玉米', '苞谷', '棒子'],
    '胡萝卜': ['胡萝卜', '红萝卜'],
    '白萝卜': ['白萝卜', '萝卜', '菜头'],
    '黄瓜': ['黄瓜', '青瓜'],
    '辣椒': ['辣椒', '海椒', '辣子'],
    '白菜': ['白菜', '大白菜', '绍菜'],
    '血皮菜': ['血皮菜', '观音菜', '紫背天葵'],
    '油麦菜': ['油麦菜', '莜麦菜'],
    '鸡蛋': ['鸡蛋', '鸡子'],
    '豆腐': ['豆腐', '水豆腐', '嫩豆腐'],
  };
  const keywords = new Set(available);
  for (const kw of available) {
    if (INGREDIENT_SYNONYMS[kw]) {
      for (const syn of INGREDIENT_SYNONYMS[kw]) keywords.add(syn);
    }
  }
  return dishes.filter(d => {
    const haystack = [
      d.name || '',
      ...(d.ingredients || []),
      ...(d.tags || []),
      ...(d.seasonings || []),
    ].join(' ');
    return [...keywords].some(kw => haystack.includes(kw));
  });
}
function chooseCombo(dishes, history = [], window = 30) {
  const recent = new Set(history.slice(-window).map(h => h.dish));
  function pick(role) {
    let candidates = dishes.filter(d => d.role === role && !recent.has(d.name));
    if (candidates.length === 0) candidates = dishes.filter(d => d.role === role);
    if (candidates.length === 0) return null;
    return candidates[Math.floor(Math.random() * candidates.length)];
  }
  return {"主菜": pick("主菜"), "汤": pick("汤"), "主食": pick("主食")};
}

const SPICY_TAGS = ["辣", "微辣", "麻辣"];
const KID_FRIENDLY_TAGS = ["小孩爱", "甜口", "酸甜", "清淡", "基础", "面食", "快手"];

function filterKidFriendly(dishes) {
  return dishes.filter(d => {
    const hasSpicy = d.tags.some(t => SPICY_TAGS.some(s => t.includes(s)));
    const hasFriendly = d.tags.some(t => KID_FRIENDLY_TAGS.includes(t));
    return hasFriendly && !hasSpicy;
  });
}

// ============ 偏好设置（Day 16：用户删了 UI 又加回来） ============
// 与 app.html 保持同语义
const PREFS_KEY = 'what-to-eat-prefs';
const PREFS_DEFAULTS = {
  spicy: 'any',
  noNumb: false,
  avoid: { offal: false, lamb: false },
  vegetarian: false,
};
const OFFAL_INGREDIENT_KEYS = ["肥肠", "猪肚", "肝", "腰", "心", "肚"];

function loadPrefs() {
  try {
    const raw = JSON.parse(storeGet(PREFS_KEY) || '{}');
    return {
      spicy: raw.spicy || 'any',
      noNumb: !!raw.noNumb,
      avoid: {
        offal: !!(raw.avoid && raw.avoid.offal),
        lamb: !!(raw.avoid && raw.avoid.lamb),
      },
      vegetarian: !!raw.vegetarian,
    };
  } catch (e) {
    return {
      spicy: PREFS_DEFAULTS.spicy,
      noNumb: PREFS_DEFAULTS.noNumb,
      avoid: Object.assign({}, PREFS_DEFAULTS.avoid),
      vegetarian: PREFS_DEFAULTS.vegetarian,
    };
  }
}

function savePrefs(p) { storeSet(PREFS_KEY, JSON.stringify(p)); }

function applyPrefs(dishes, prefs) {
  if (!prefs) return dishes.slice();
  let result = dishes;
  if (prefs.spicy === 'none') {
    result = result.filter(d => !d.tags.some(t => SPICY_TAGS.some(s => t.includes(s))));
  } else if (prefs.spicy === 'mild') {
    result = result.filter(d => !d.tags.some(t => t === '辣' || t === '麻辣'));
  }
  if (prefs.noNumb) {
    result = result.filter(d => !d.tags.some(t => t.includes('麻辣')));
  }
  const avoid = prefs.avoid || {};
  const ingHas = (d, keys) => (d.ingredients || []).some(ing => keys.some(k => ing.includes(k)));
  if (avoid.offal) {
    result = result.filter(d => !ingHas(d, OFFAL_INGREDIENT_KEYS));
  }
  if (avoid.lamb) {
    result = result.filter(d => !(d.ingredients || []).some(ing => ing.includes('羊')));
  }
  if (prefs.vegetarian) {
    result = result.filter(d => (d.tags || []).includes('素食'));
  }
  return result;
}

// ============ Day 8：一日三餐 + 营养均衡 ============
const PROTEIN_KEYS = ["鸡", "鸭", "鹅", "猪", "牛", "羊", "鱼", "虾", "蟹", "蛋", "豆腐", "豆浆", "牛奶", "奶酪"];
const CARB_KEYS    = ["米", "面", "馒头", "饺子", "包子", "土豆", "红薯", "玉米", "燕麦", "饼", "年糕", "糯米", "面包"];
const VEG_KEYS     = ["青", "芹", "白菜", "菜", "萝卜", "木耳", "菇", "海带", "茄", "黄瓜", "豆", "菠", "韭菜"];

function classifyNutrition(dish) {
  if (dish.nutrition && dish.nutrition.length > 0) return dish.nutrition.slice();
  const joined = (dish.ingredients || []).join(" ");
  const classes = [];
  if (PROTEIN_KEYS.some(k => joined.includes(k))) classes.push("蛋白");
  if (CARB_KEYS.some(k => joined.includes(k))) classes.push("碳水");
  if (VEG_KEYS.some(k => joined.includes(k))) classes.push("蔬菜");
  return classes;
}

function parseHistoryDate(s) { try { return new Date(s); } catch (e) { return new Date(0); } }
function isWithinWindow(dateStr, windowDays) {
  if (!dateStr) return true;
  const d = parseHistoryDate(dateStr);
  if (isNaN(d.getTime())) return true;
  const cutoff = new Date(Date.now() - windowDays * 86400000);
  return d >= cutoff;
}

function chooseThreeMeals(dishes, history = [], window = 7) {
  const recent = new Set(
    history.filter(h => isWithinWindow(h.date, window)).map(h => h.dish)
  );
  function pick(role, exclude) {
    let candidates = dishes.filter(d =>
      d.role === role && !exclude.has(d.name) && !recent.has(d.name));
    if (candidates.length === 0) {
      candidates = dishes.filter(d => d.role === role && !recent.has(d.name));
    }
    if (candidates.length === 0) {
      candidates = dishes.filter(d => d.role === role);
    }
    if (candidates.length === 0) return null;
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  const breakfast = pick("早餐", new Set());
  const exclude = new Set();
  if (breakfast) exclude.add(breakfast.name);

  const lunch = {
    "主菜": pick("主菜", exclude),
    "主食": pick("主食", exclude),
    "凉菜": pick("凉菜", exclude),
    "汤":   pick("汤",   exclude),
  };
  Object.values(lunch).forEach(d => { if (d) exclude.add(d.name); });

  const dinner = {
    "主菜": pick("主菜", exclude),
    "主食": pick("主食", exclude),
    "凉菜": pick("凉菜", exclude),
  };

  return {"早餐": breakfast, "午餐": lunch, "晚餐": dinner};
}

// ============ Day 10：做饭前确认（历史记录 status 字段）===========
function addToHistoryWithStatus(history, dish, status, suggested) {
  history.push({
    date: new Date().toISOString().slice(0, 10),
    dish: dish,
    status: status,
    suggested: (status === 'confirmed') ? undefined : suggested
  });
  return history;
}

function migrateHistory(history) {
  // 旧格式 {dish, date} → 新格式（默认 status='confirmed'）
  return history.map(h => {
    if (h.status) return h;
    return {date: h.date, dish: h.dish, status: 'confirmed', suggested: undefined};
  });
}

// ============ Day 15：toggle 撤回工具 ============
// 精准按 index 删一条历史（避免误删）
function removeHistoryAt(history, index) {
  if (index < 0 || index >= history.length) return history;
  history.splice(index, 1);
  return history;
}

// chooseCombo 改编：过滤跳过
function chooseComboV2(dishes, history = [], window = 30) {
  const effective = migrateHistory(history);
  const recent = new Set(
    effective
      .filter(h => h.status !== 'skipped')
      .slice(-window)
      .map(h => h.dish)
  );
  function pick(role) {
    let candidates = dishes.filter(d => d.role === role && !recent.has(d.name));
    if (candidates.length === 0) candidates = dishes.filter(d => d.role === role);
    if (candidates.length === 0) return null;
    return candidates[Math.floor(Math.random() * candidates.length)];
  }
  return {"主菜": pick("主菜"), "汤": pick("汤"), "主食": pick("主食")};
}

// ============ Day 10：偏好设置 applyPrefs ============
const PREFS_SEAFOOD_KEYS = ["鱼", "虾", "蟹", "紫菜", "海带", "扇贝", "蛤", "牡蛎", "鱿鱼"];
const PREFS_OFFAL_KEYS   = ["肥肠", "猪肚", "肝", "腰", "心", "肚"];

function applyPrefs(dishes, prefs) {
  prefs = prefs || {};
  let result = dishes.slice();

  if (prefs.cuisines && prefs.cuisines.length > 0) {
    result = result.filter(d => (d.tags || []).some(t => prefs.cuisines.includes(t)));
  }
  if (prefs.spicy === 'none') {
    result = result.filter(d => !(d.tags || []).some(t => SPICY_TAGS.some(s => t.includes(s))));
  } else if (prefs.spicy === 'mild') {
    result = result.filter(d => !(d.tags || []).some(t => t === '辣' || t === '麻辣'));
  }
  if (prefs.noNumb) {
    result = result.filter(d => !(d.tags || []).some(t => t.includes('麻辣')));
  }
  const avoid = prefs.avoid || {};
  const hasIngredient = (d, keys) => (d.ingredients || []).some(ing => keys.some(k => ing.includes(k)));
  if (avoid.seafood)    result = result.filter(d => !hasIngredient(d, PREFS_SEAFOOD_KEYS));
  if (avoid.offal)      result = result.filter(d => !hasIngredient(d, PREFS_OFFAL_KEYS));
  if (avoid.cilantro)   result = result.filter(d => !(d.ingredients || []).some(ing => ing.includes('香菜')));
  if (avoid.beef)       result = result.filter(d => !(d.ingredients || []).some(ing => ing.includes('牛')));
  if (avoid.lamb)       result = result.filter(d => !(d.ingredients || []).some(ing => ing.includes('羊')));
  if (avoid.centuryEgg) result = result.filter(d => !(d.ingredients || []).some(ing => ing.includes('皮蛋')));
  if (prefs.maxTime && prefs.maxTime > 0) {
    result = result.filter(d => d.time_minutes <= prefs.maxTime);
  }
  if (prefs.vegetarian) {
    result = result.filter(d => (d.tags || []).includes('素食'));
  }
  if (prefs.noCold) {
    result = result.filter(d => d.role !== '凉菜');
  }
  return result;
}

// ============ Day 11：自催化学习 ============
function computeTagAffinities(scores, dishes) {
  const tagPos = {}, tagNeg = {};
  for (const d of dishes) {
    const s = scores[d.name] || {};
    const pos = (s.likes || 0) + (s.cooks || 0);
    const neg = (s.dislikes || 0);
    if (pos + neg === 0) continue;
    for (const t of (d.tags || [])) {
      tagPos[t] = (tagPos[t] || 0) + pos;
      tagNeg[t] = (tagNeg[t] || 0) + neg;
    }
  }
  const aff = {};
  const all = new Set([...Object.keys(tagPos), ...Object.keys(tagNeg)]);
  for (const t of all) {
    const total = (tagPos[t] || 0) + (tagNeg[t] || 0);
    if (total < 3) { aff[t] = 0; continue; }
    aff[t] = ((tagPos[t] / total) - 0.5) * 2;
  }
  return aff;
}

function weightedChoice(candidates, scores, tagAff) {
  if (!candidates || candidates.length === 0) return null;
  const weights = candidates.map(d => {
    const s = scores[d.name] || {};
    let w = 1.0;
    w += (s.likes || 0) * 3;
    w += (s.cooks || 0) * 2;
    w -= (s.dislikes || 0) * 5;
    for (const t of (d.tags || [])) {
      w += (tagAff[t] || 0) * 4;
    }
    return Math.max(w, 0.1);
  });
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < candidates.length; i++) {
    r -= weights[i];
    if (r <= 0) return candidates[i];
  }
  return candidates[candidates.length - 1];
}

// ============ 测试框架 ============
const results = [];
let currentGroup = "";
function group(name) { currentGroup = name; }
function test(name, fn) {
  try { fn(); results.push({pass: true, group: currentGroup, name}); }
  catch (e) { results.push({pass: false, group: currentGroup, name, error: e.message}); }
}
function assert(cond, msg) { if (!cond) throw new Error(msg || "Assertion failed"); }
function assertEqual(a, b, msg) {
  if (JSON.stringify(a) !== JSON.stringify(b)) {
    throw new Error(msg || `Expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`);
  }
}

// ============ 测试用例 ============
group("chooseOne");
test("从列表返回一项", () => {
  const r = chooseOne(["a", "b", "c"]);
  assert(["a", "b", "c"].includes(r));
});

group("filterByMaxTime");
test("只返回时间内的菜", () => {
  const dishes = [new Dish({name: "快", time_minutes: 15}), new Dish({name: "慢", time_minutes: 60})];
  const r = filterByMaxTime(dishes, 30);
  assertEqual(r.map(d => d.name), ["快"]);
});
test("空列表返回空", () => assertEqual(filterByMaxTime([], 30), []));

group("filterByIngredients");
test("匹配至少一种食材", () => {
  const dishes = [
    new Dish({name: "西红柿炒蛋", time_minutes: 15, ingredients: ["鸡蛋", "西红柿"]}),
    new Dish({name: "凉拌黄瓜", time_minutes: 5, ingredients: ["黄瓜"]})
  ];
  const r = filterByIngredients(dishes, ["鸡蛋"]);
  const names = r.map(d => d.name);
  assert(names.includes("西红柿炒蛋"));
  assert(!names.includes("凉拌黄瓜"));
});
test("空冰箱返回空", () => {
  const dishes = [new Dish({name: "x", time_minutes: 1, ingredients: ["a"]})];
  assertEqual(filterByIngredients(dishes, []), []);
});
test("『肉』同义词展开：匹配 猪/牛/羊/鸡/鸭/排骨", () => {
  const dishes = [
    new Dish({name: "红烧肉", time_minutes: 60, ingredients: ["五花肉 500g"]}),
    new Dish({name: "麻婆豆腐", time_minutes: 20, ingredients: ["豆腐", "牛肉末"]}),
    new Dish({name: "宫保鸡丁", time_minutes: 25, ingredients: ["鸡腿肉"]}),
    new Dish({name: "冬瓜排骨汤", time_minutes: 40, ingredients: ["冬瓜", "排骨"]}),
    new Dish({name: "西红柿炒蛋", time_minutes: 15, ingredients: ["鸡蛋", "西红柿"]}),  // 含鸡蛋但不是肉
    new Dish({name: "凉拌黄瓜", time_minutes: 5, ingredients: ["黄瓜"]}),
  ];
  const names = filterByIngredients(dishes, ["肉"]).map(d => d.name);
  assert(names.includes("红烧肉"));
  assert(names.includes("麻婆豆腐"));
  assert(names.includes("宫保鸡丁"));
  assert(names.includes("冬瓜排骨汤"));
  assert(!names.includes("西红柿炒蛋"), "鸡蛋不算肉");
  assert(!names.includes("凉拌黄瓜"));
});
test("按菜名匹配", () => {
  const dishes = [
    new Dish({name: "肉末茄子", time_minutes: 25, ingredients: ["茄子", "猪肉末"]}),
    new Dish({name: "西红柿炒蛋", time_minutes: 15, ingredients: ["鸡蛋", "西红柿"]}),
  ];
  const names = filterByIngredients(dishes, ["肉"]).map(d => d.name);
  assert(names.includes("肉末茄子"));  // 名字有肉 + 食材有猪肉
  assert(!names.includes("西红柿炒蛋"));
});
test("按 tags 匹配", () => {
  const dishes = [
    new Dish({name: "x", time_minutes: 15, ingredients: ["unknown"], tags: ["肉类"]}),
    new Dish({name: "y", time_minutes: 10, ingredients: ["蔬菜"], tags: ["素食"]}),

// ============ Day 10.2：内联按钮 → status 映射契约 ============
// 模拟 applyDecisionToSlot 的核心逻辑（不带 DOM）
// Day 15: 支持 toggle 撤回 + 切换 + 强制替换（manual 二次输入）
// 返回 {hist, prevIndex, prevState, mode} 以便测试断言
function slotAction(history, action, originalDish, manualName, ctx, opts) {
  opts = opts || {};
  ctx = ctx || {};
  const prevIndex = ctx.historyIndex;
  const prevState = ctx.state;
  // 1) 撤回路径：同 action 再点
  if (!opts.forceReplace && prevIndex !== undefined && prevState === action) {
    removeHistoryAt(history, prevIndex);
    delete ctx.historyIndex;
    delete ctx.state;
    return { mode: '撤回' };
  }
  // 2) 切换 action / 强制替换：先撤旧的
  if (prevIndex !== undefined && prevState && (prevState !== action || opts.forceReplace)) {
    removeHistoryAt(history, prevIndex);
  }
  // 3) 写新历史
  if (action === 'confirmed') {
    addToHistoryWithStatus(history, originalDish.name, 'confirmed', null);
  } else if (action === 'skipped') {
    addToHistoryWithStatus(history, '没做饭', 'skipped', originalDish.name);
  } else if (action === 'manual') {
    addToHistoryWithStatus(history, manualName, 'manual', originalDish.name);
  }
  // 'redraw' 不写历史
  if (action !== 'redraw') {
    ctx.historyIndex = history.length - 1;
    ctx.state = action;
    return { mode: '写' };
  }
  return { mode: 'noop' };
}

// 复制自 app.html 的核心函数（测试不依赖 DOM，用 stub）

function parseMealInput(str) {
  if (!str) return [];
  const seen = new Set();
  const out = [];
  for (const raw of String(str).split(',')) {
    const name = raw.trim();
    if (!name || seen.has(name)) continue;
    seen.add(name);
    out.push(name);
  }
  return out;
}

const VALID_MEALS_JS = ["早餐", "午餐", "晚餐"];
function logManualJS(history, meals, dateStr, scores) {
  let written = 0;
  for (const mealKey of VALID_MEALS_JS) {
    const names = parseMealInput(meals[mealKey]);
    for (const name of names) {
      history.push({ dish: name, date: dateStr, status: 'manual', meal: mealKey });
      if (scores && !scores[name]) scores[name] = { likes: 0, dislikes: 0, cooks: 0 };
      if (scores) scores[name].cooks += 1;
      written++;
    }
  }
  return written;
}

// ============ 编辑单条记录（Day 16.2） ============
// 纯函数版本（测试用）：history.indexOf 找位置 → 原地替换
// 与 app.html 的 saveEditLog 同语义
function editLogEntry(history, targetEntry, updates) {
  const idx = history.indexOf(targetEntry);
  if (idx === -1) return null;
  history[idx] = Object.assign({}, targetEntry, updates);
  return history[idx];
}

// ============ 单槽位换一道（Day 16.3） ============
// 纯函数版本：返回新菜名（null = 无候选）
// 与 app.html 的 redrawSlot 候选筛选同语义（不含 DOM 操作）
function pickRedrawDish(pool, role, shownNames, recentNames, scores, tagAff) {
  const exclude = new Set([...(shownNames || []), ...(recentNames || [])]);
  let cands = pool.filter(d => d.role === role && !exclude.has(d.name));
  if (cands.length === 0) cands = pool.filter(d => d.role === role && !(shownNames || []).includes(d.name));
  if (cands.length === 0) cands = pool.filter(d => d.role === role);
  if (cands.length === 0) return null;
  return weightedChoice(cands, scores, tagAff).name;
}

// ============ Day 13：跨入口同步（cookie + localStorage 双写） ============
// iOS 上 localStorage 在 Safari vs 桌面 PWA 隔离，但 cookie 不隔离
// 复制 app.html 中的 cookie + store 辅助函数用于测试

const COOKIE_PREFIX_TEST = 'wte2-';

function cookieSet(name, value) {
  const maxChunk = 3500;
  const chunks = Math.ceil(value.length / maxChunk);
  const expDays = 365;
  for (let i = 0; i < chunks; i++) {
    const chunk = value.slice(i * maxChunk, (i + 1) * maxChunk);
    document.cookie = `${COOKIE_PREFIX_TEST}${name}-${i}=${encodeURIComponent(chunk)}; max-age=${expDays*86400}; path=/; SameSite=Lax`;
  }
  document.cookie = `${COOKIE_PREFIX_TEST}${name}-n=${chunks}; max-age=${expDays*86400}; path=/; SameSite=Lax`;
}

function cookieGet(name) {
  const lenMatch = document.cookie.match(new RegExp(`(?:^|;\\s*)${COOKIE_PREFIX_TEST}${name}-n=(\\d+)`));
  const n = lenMatch ? parseInt(lenMatch[1]) : 1;
  if (n === 0) return null;
  let value = '';
  for (let i = 0; i < n; i++) {
    const match = document.cookie.match(new RegExp(`(?:^|;\\s*)${COOKIE_PREFIX_TEST}${name}-${i}=([^;]*)`));
    if (match) value += decodeURIComponent(match[1]);
    else return null;
  }
  return value || null;
}

function cookieDel(name) {
  const lenMatch = document.cookie.match(new RegExp(`(?:^|;\\s*)${COOKIE_PREFIX_TEST}${name}-n=(\\d+)`));
  const n = lenMatch ? parseInt(lenMatch[1]) : 1;
  for (let i = 0; i < n; i++) {
    document.cookie = `${COOKIE_PREFIX_TEST}${name}-${i}=; max-age=0; path=/`;
  }
  document.cookie = `${COOKIE_PREFIX_TEST}${name}-n=; max-age=0; path=/`;
}

function storeGet(key) {
  const local = localStorage.getItem(key);
  if (local !== null && local !== '') return local;
  const cookie = cookieGet(key);
  if (cookie !== null && cookie !== '') {
    try { localStorage.setItem(key, cookie); } catch (e) {}
    return cookie;
  }
  return null;
}

function storeSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) {}
  try { cookieSet(key, value); } catch (e) {}
}

function storeDel(key) {
  try { localStorage.removeItem(key); } catch (e) {}
  try { cookieDel(key); } catch (e) {}
}

// ============ Day 14: 月度报告聚合 ============
function getCurrentMonth() {
  const now = new Date();
  return { year: now.getFullYear(), month: now.getMonth() + 1 };
}

function filterHistoryByMonth(history, year, month) {
  const prefix = `${year}-${String(month).padStart(2, '0')}-`;
  return history.filter(e => e.date && e.date.startsWith(prefix));
}

function topDishes(history, n) {
  const counts = {};
  for (const e of history) {
    counts[e.dish] = (counts[e.dish] || 0) + 1;
  }
  return Object.entries(counts)
    .map(([dish, count]) => ({ dish, count }))
    .sort((a, b) => b.count - a.count || a.dish.localeCompare(b.dish))
    .slice(0, n || 5);
}

function mealDistribution(history) {
  const dist = { '早餐': 0, '午餐': 0, '晚餐': 0, '未指定': 0 };
  for (const e of history) {
    const k = e.meal || '未指定';
    dist[k] = (dist[k] || 0) + 1;
  }
  return dist;
}

function statusDistribution(history) {
  const dist = { confirmed: 0, manual: 0, skipped: 0 };
  for (const e of history) {
    const k = e.status || 'confirmed';
    dist[k] = (dist[k] || 0) + 1;
  }
  return dist;
}

function uniqueDishCount(history) {
  const set = new Set();
  for (const e of history) set.add(e.dish);
  return set.size;
}

function tagDistribution(history, dishesData) {
  const nameToTags = {};
  for (const d of (dishesData || [])) nameToTags[d.name] = d.tags || [];
  const counts = {};
  for (const e of history) {
    const tags = nameToTags[e.dish] || [];
    for (const t of tags) counts[t] = (counts[t] || 0) + 1;
  }
  // 转成数组并按 count 降序
  return Object.entries(counts)
    .map(([tag, count]) => ({ tag, count }))
    .sort((a, b) => b.count - a.count);
}

// 多份主菜用于测试
const REDRAW_POOL = [
  new Dish({name: "红烧肉", role: "主菜", tags: ["下饭"]}),
  new Dish({name: "糖醋排骨", role: "主菜", tags: ["酸甜"]}),
  new Dish({name: "宫保鸡丁", role: "主菜", tags: ["辣"]}),
  new Dish({name: "西红柿炒蛋", role: "主菜", tags: ["小孩爱"]}),
  new Dish({name: "紫菜蛋花汤", role: "汤"}),
  new Dish({name: "米饭", role: "主食"}),
  new Dish({name: "面条", role: "主食"}),
];

test("返回 role 匹配且未被排除的菜", () => {
  const r = pickRedrawDish(REDRAW_POOL, "主菜", ["红烧肉"], [], {}, {});
  assert(r !== null, "应能抽到");
  assert(r !== "红烧肉", "不能是已显示的");
  assert(REDRAW_POOL.some(d => d.name === r && d.role === "主菜"), "应仍是主菜");
});

test("不重复本面板已显示的菜", () => {
  for (let i = 0; i < 30; i++) {
    const r = pickRedrawDish(REDRAW_POOL, "主菜", ["红烧肉", "糖醋排骨"], [], {}, {});
    assert(r !== "红烧肉");
    assert(r !== "糖醋排骨");
  }
});

test("不重复近期历史中的菜（30 天）", () => {
  for (let i = 0; i < 30; i++) {
    const r = pickRedrawDish(REDRAW_POOL, "主菜", [], ["宫保鸡丁"], {}, {});
    assert(r !== "宫保鸡丁");
  }
});

test("主菜 + 排除过多 → fallback 1（去掉历史限制）", () => {
  // 池子有 4 道主菜，排除掉 3 道，只剩 1 道
  const r = pickRedrawDish(REDRAW_POOL, "主菜", [], ["红烧肉", "糖醋排骨", "宫保鸡丁"], {}, {});
  assertEqual(r, "西红柿炒蛋"); // 唯一剩下的
});

test("主菜 + 全排除 → fallback 2（什么都不排除）", () => {
  const r = pickRedrawDish(REDRAW_POOL, "主菜",
    ["红烧肉", "糖醋排骨", "宫保鸡丁", "西红柿炒蛋"],  // 4 道全在面板
    [], {}, {});
  // 4 道主菜全在 shownNames 里 → fallback 2 应还能抽到
  assert(REDRAW_POOL.some(d => d.name === r && d.role === "主菜"), "应能抽到任一主菜");
});

test("role 不存在 → 返回 null", () => {
  const r = pickRedrawDish(REDRAW_POOL, "不存在role", [], [], {}, {});
  assertEqual(r, null);
});

test("shownNames / recentNames 为空/undefined 不报错", () => {
  const r = pickRedrawDish(REDRAW_POOL, "汤", null, undefined, {}, {});
  assertEqual(r, "紫菜蛋花汤");
});

// ============ 渲染结果 ============
const passed = results.filter(r => r.pass).length;
const failed = results.length - passed;

document.getElementById('summary').className = `summary ${failed === 0 ? 'pass' : 'fail'}`;
document.getElementById('summary').textContent = failed === 0
  ? `✅ 全部通过：${passed} / ${results.length}`
  : `❌ 失败 ${failed} 个：通过 ${passed} / ${results.length}`;

const resultsDiv = document.getElementById('results');
let lastGroup = "";
for (const r of results) {
  if (r.group !== lastGroup) {
    lastGroup = r.group;
    const header = document.createElement('div');
    header.className = 'group-header';
    header.textContent = r.group;
    resultsDiv.appendChild(header);
  }
  const row = document.createElement('div');
  row.className = `test-row ${r.pass ? 'pass' : 'fail'}`;
  row.innerHTML = `<span class="name">${r.name}</span>` +
    (r.error ? `<div class="error">${r.error}</div>` : '');
  resultsDiv.appendChild(row);
}
</script>
